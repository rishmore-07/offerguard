# Render Free blueprint for OfferGuard.
# The production API serves ml/models/offerguard_baseline.joblib only.
# Do not install backend/requirements-inference.txt on this plan:
# that file is for local Qwen LoRA evaluation and does not fit in 512 MB.
services:
  - type: web
    name: offerguard-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MODEL_PROVIDER
        value: baseline
      - key: OFFERGUARD_MODEL_PATH
        value: ml/models/offerguard_baseline.joblib
      - key: CORS_ORIGINS
        fromService:
          name: offerguard-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: offerguard-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        fromService:
          name: offerguard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
